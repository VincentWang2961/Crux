services:
  web:
    build: .
    image: crux:latest
    container_name: crux
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    volumes:
      # Availability edits from /admin; survives rebuilds.
      - crux-data:/app/data

volumes:
  crux-data:
